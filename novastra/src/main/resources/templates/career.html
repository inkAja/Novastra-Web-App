<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novastra — Career &amp; PoW Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <link rel="stylesheet" href="/assets/css/career.css?v=3" />
</head>
<body data-page="career" class="cr-page min-h-screen bg-[#FDFBF7] text-[#2C2A27]">
  <header class="cr-mobile-header">
    <a href="/home" class="cr-brand-link" aria-label="Novastra Home">
      <span class="cr-brand-circle" aria-hidden="true">N</span>
      <span class="cr-brand-name">Novastra</span>

  </header>

  <main id="main-content" class="p-4 md:p-8 max-w-7xl mx-auto space-y-6"></main>

  <nav class="cr-bottom-nav" aria-label="Navigasi Utama Mobile">
    <a href="/home" class="cr-nav-item">
      <span class="cr-nav-icon-box"><i data-lucide="home" class="w-5 h-5"></i></span>
      <span class="cr-nav-label">Home</span>
    </a>
    <a href="/learn" class="cr-nav-item">
      <span class="cr-nav-icon-box"><i data-lucide="book-open" class="w-5 h-5"></i></span>
      <span class="cr-nav-label">Learn</span>
    </a>
    <a href="/career" class="cr-nav-item is-active" aria-current="page">
      <span class="cr-nav-icon-box"><i data-lucide="briefcase" class="w-5 h-5"></i></span>
      <span class="cr-nav-label">Career</span>
    </a>
    <a href="/profile" class="cr-nav-item">
      <span class="cr-nav-icon-box"><i data-lucide="user" class="w-5 h-5"></i></span>
      <span class="cr-nav-label">Profile</span>
    </a>
  </nav>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/components.js?v=2"></script>
  <script src="/assets/js/career.js?v=8"></script>

</html>
