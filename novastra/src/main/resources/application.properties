spring.application.name=novastra

# PostgreSQL Connection (DB-Novastra, schema public)
spring.datasource.url=jdbc:postgresql://localhost:5432/DB-Novastra
spring.datasource.username=postgres
spring.datasource.password=admin_novastra
spring.jpa.hibernate.ddl-auto=none

# JPA / Hibernate — tabel sudah ada di PostgreSQL
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

server.address=0.0.0.0
server.port=8080


