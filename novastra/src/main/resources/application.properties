spring.application.name=novastra

# Koneksi PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/novastra
spring.datasource.username=postgres

# Konfigurasi JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port aplikasi
server.port=8080
