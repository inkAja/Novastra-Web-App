services:
  novastra-db:
    image: postgres:18-alpine
    container_name: novastra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: DB-Novastra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin_novastra
    ports:
      - "5432:5432"
    volumes:
      - novastra_pgdata:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d

volumes:
  novastra_pgdata: